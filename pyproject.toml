[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bs2autotune"
version = "1.0.0"
description = "Automatic sound matching for the Novation Bass Station II: give it a bass line, get the patch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "soundfile>=0.12.1",
    "sounddevice>=0.4.6",
    "mido>=1.3.2",
    "python-rtmidi>=1.5.8",
]

[project.optional-dependencies]
separation = ["demucs>=4.0"]
dev = ["pytest>=7.4"]

[project.scripts]
bs2autotune = "bs2autotune.__main__:main"

[tool.setuptools]
packages = ["bs2autotune"]

[tool.setuptools.package-data]
bs2autotune = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
